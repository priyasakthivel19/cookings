<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chef Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e9efe4;
      --surface: #ffffff;
      --ink: #1d2b1f;
      --muted: #5d6e5f;
      --basil: #2c6a3b;
      --basil-dark: #1f4f2b;
      --saffron: #f3b93a;
      --line: #d3dccb;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px;
    }

    header {
      padding: 24px 4px 16px;
      border-bottom: 2px solid var(--basil);
    }

    header h1 {
      font-family: Fraunces, Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--basil-dark);
      line-height: 1.1;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: var(--radius);
      overflow-wrap: anywhere;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }

    .message.user {
      align-self: flex-end;
      background: var(--saffron);
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    .message.error {
      align-self: flex-start;
      background: #fdeceb;
      border: 1px solid #f0b8b4;
      color: #8a2a22;
      border-bottom-left-radius: 4px;
    }

    .message p + p,
    .message p + ul,
    .message p + ol,
    .message ul + p,
    .message ol + p { margin-top: 8px; }

    .message ul, .message ol { padding-left: 22px; }

    .typing { display: flex; gap: 5px; align-items: center; padding: 16px; }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--basil);
      animation: bounce 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-4px); }
    }

    #suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 4px 12px;
    }

    #suggestions button {
      font: inherit;
      font-size: 0.9rem;
      color: var(--basil-dark);
      background: transparent;
      border: 1.5px solid var(--basil);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
    }

    #suggestions button:hover { background: var(--basil); color: #fff; }

    form {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 12px 0 20px;
      border-top: 1px solid var(--line);
    }

    textarea {
      flex: 1;
      font: inherit;
      color: var(--ink);
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 16px;
      resize: none;
      max-height: 140px;
    }

    textarea:focus { outline: none; border-color: var(--basil); }

    #send {
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--basil);
      border: none;
      border-radius: var(--radius);
      padding: 12px 22px;
      cursor: pointer;
    }

    #send:hover:not(:disabled) { background: var(--basil-dark); }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }

    button:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      .typing span { animation: none; opacity: 0.6; }
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.6rem; }
      .message { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Chef Bot</h1>
      <p>Your cooking assistant for recipes, techniques and kitchen questions.</p>
    </header>

    <main id="messages" aria-live="polite"></main>

    <div id="suggestions">
      <button type="button">Quick dinner with eggs and rice</button>
      <button type="button">How do I make fluffy pancakes?</button>
      <button type="button">What can I use instead of butter?</button>
    </div>

    <form id="chat-form">
      <textarea id="input" rows="1" maxlength="1000" placeholder="Ask a cooking question" aria-label="Your message"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("input");
    const sendEl = document.getElementById("send");
    const suggestionsEl = document.getElementById("suggestions");

    const history = [];

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatInline(text) {
      return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    function renderMarkdown(text) {
      const lines = text.split("\n");
      let html = "";
      let listType = null;

      const closeList = () => {
        if (listType) {
          html += `</${listType}>`;
          listType = null;
        }
      };

      for (const raw of lines) {
        const line = raw.trim();
        const bullet = line.match(/^[-*]\s+(.*)/);
        const numbered = line.match(/^\d+[.)]\s+(.*)/);

        if (bullet || numbered) {
          const type = bullet ? "ul" : "ol";
          if (listType !== type) {
            closeList();
            html += `<${type}>`;
            listType = type;
          }
          html += `<li>${formatInline((bullet || numbered)[1])}</li>`;
        } else if (line) {
          closeList();
          html += `<p>${formatInline(line)}</p>`;
        } else {
          closeList();
        }
      }

      closeList();
      return html;
    }

    function addMessage(text, type) {
      const el = document.createElement("div");
      el.className = `message ${type}`;
      if (type === "bot") {
        el.innerHTML = renderMarkdown(text);
      } else {
        el.textContent = text;
      }
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    function showTyping() {
      const el = document.createElement("div");
      el.className = "message bot typing";
      el.innerHTML = "<span></span><span></span><span></span>";
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    function setBusy(busy) {
      sendEl.disabled = busy;
      inputEl.disabled = busy;
      if (!busy) inputEl.focus();
    }

    function resizeInput() {
      inputEl.style.height = "auto";
      inputEl.style.height = `${inputEl.scrollHeight}px`;
    }

    async function sendMessage(message) {
      suggestionsEl.hidden = true;
      addMessage(message, "user");
      inputEl.value = "";
      resizeInput();
      setBusy(true);

      const typingEl = showTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();
        typingEl.remove();

        if (!response.ok) {
          addMessage(data.error || "Something went wrong. Please try again.", "error");
        } else {
          addMessage(data.reply, "bot");
          history.push({ role: "user", text: message });
          history.push({ role: "model", text: data.reply });
        }
      } catch (error) {
        typingEl.remove();
        addMessage("Could not reach the server. Check your connection and try again.", "error");
      } finally {
        setBusy(false);
      }
    }

    formEl.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = inputEl.value.trim();
      if (message) sendMessage(message);
    });

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        formEl.requestSubmit();
      }
    });

    inputEl.addEventListener("input", resizeInput);

    suggestionsEl.addEventListener("click", (event) => {
      if (event.target.tagName === "BUTTON") sendMessage(event.target.textContent);
    });

    addMessage({{ welcome_message | tojson }}, "bot");
    inputEl.focus();
  </script>
</body>
</html>
